apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hello-python
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/deepakjaiswal09/argocd_handson.git
    targetRevision: main
    path: app2

    helm:
      releaseName: hello-python

  destination:
    server: https://kubernetes.default.svc
    namespace: hello-python

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true