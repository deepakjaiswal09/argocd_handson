apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-app2
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/deepakjaiswal09/argocd_handson.git
    targetRevision: main
    path: argocd

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true